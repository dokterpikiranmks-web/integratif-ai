<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="nerve-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>

  <!-- Subtle outer pulse circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Meridian & Nerve Network Lines -->
  <g stroke="url(#nerve-grad)" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M 256 120 L 256 392" />
    <path d="M 170 200 Q 256 256 342 200" fill="none" />
    <path d="M 150 280 Q 256 256 362 280" fill="none" />
    <path d="M 190 350 Q 256 310 322 350" fill="none" />
  </g>

  <!-- Acupressure / Totok Saraf Nodes -->
  <circle cx="256" cy="130" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="200" r="12" fill="#4ade80" filter="url(#glow)" />
  <circle cx="256" cy="270" r="16" fill="#22c55e" filter="url(#glow)" />
  <circle cx="256" cy="340" r="12" fill="#4ade80" filter="url(#glow)" />
  
  <circle cx="170" cy="200" r="10" fill="#38bdf8" />
  <circle cx="342" cy="200" r="10" fill="#38bdf8" />
  <circle cx="150" cy="280" r="10" fill="#4ade80" />
  <circle cx="362" cy="280" r="10" fill="#4ade80" />

  <!-- Botanical / Herbal Leaf (Dapur Terapeutik) Overlay -->
  <path d="M 256 170 C 310 170 350 210 350 270 C 350 330 290 350 256 380 C 222 350 162 330 162 270 C 162 210 202 170 256 170 Z" 
        fill="url(#leaf-grad)" fill-opacity="0.25" stroke="#4ade80" stroke-width="4"/>
  <path d="M 256 190 Q 256 270 256 350" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Energy Core -->
  <circle cx="256" cy="270" r="8" fill="#ffffff" filter="url(#glow)"/>
</svg>
